<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0b0f19; font-family:'Segoe UI', Roboto, Arial, sans-serif;">
  <defs>
    <marker id="aCyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#22d3ee"/></marker>
    <marker id="aAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/></marker>
    <marker id="aGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34d399"/></marker>
  </defs>

  <!-- Header -->
  <rect x="25" y="18" width="1150" height="82" rx="14" fill="#131b2e" stroke="#1e293b" stroke-width="2"/>
  <text x="50" y="52" font-size="22.5" font-weight="bold" fill="#38bdf8">⚙️ РОАДМАП BACKEND SYSTEMS ENGINEER: ОТ ОС И СОКЕТОВ ДО HIGH-LOAD И SRE (ФАЗЫ 0–7)</text>
  <text x="50" y="80" font-size="13.5" fill="#94a3b8">Системный подход: Kleppmann (DDIA) + MIT 6.5840 + CMU 15-445 + Brendan Gregg + Protohackers + Gossip Glomers</text>

  <!-- Top Row: Phases 0 to 3 -->
  <g transform="translate(25, 128)">
    <rect width="265" height="196" rx="12" fill="#111827" stroke="#06b6d4" stroke-width="2"/>
    <rect x="14" y="14" width="237" height="32" rx="7" fill="#0891b2"/>
    <text x="132" y="35" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">ФАЗА 0–1: ОС И ЯДРО (4 нед)</text>
    <text x="18" y="68" font-size="12.5" font-weight="bold" fill="#67e8f9">Как компьютер реально работает</text>
    <text x="18" y="90" font-size="11.8" fill="#cbd5e1">• Виртуальная память, Page Cache</text>
    <text x="18" y="110" font-size="11.8" fill="#cbd5e1">• Syscalls, FD, User vs Kernel</text>
    <text x="18" y="130" font-size="11.8" fill="#cbd5e1">• epoll / io_uring, TCP/IP, TLS</text>
    <text x="18" y="150" font-size="11.8" fill="#cbd5e1">• HTTP/1.1 vs HTTP/2 vs HTTP/3</text>
    <text x="18" y="178" font-size="11" fill="#34d399">✔ Лаба: Protohackers + strace</text>
  </g>

  <line x1="292" y1="226" x2="318" y2="226" stroke="#22d3ee" stroke-width="3" marker-end="url(#aCyan)"/>

  <g transform="translate(322, 128)">
    <rect width="265" height="196" rx="12" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
    <rect x="14" y="14" width="237" height="32" rx="7" fill="#2563eb"/>
    <text x="132" y="35" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">ФАЗА 2: КОД И КОНКУРЕНТНОСТЬ</text>
    <text x="18" y="68" font-size="12.5" font-weight="bold" fill="#93c5fd">Язык Go / Python / Rust (5 нед)</text>
    <text x="18" y="90" font-size="11.8" fill="#cbd5e1">• Threads vs Event Loop vs Go M:N</text>
    <text x="18" y="110" font-size="11.8" fill="#cbd5e1">• Mutex, RWMutex, Atomics, Race</text>
    <text x="18" y="130" font-size="11.8" fill="#cbd5e1">• Ring Buffer, LRU, Bloom Filter</text>
    <text x="18" y="150" font-size="11.8" fill="#cbd5e1">• GC (Stop-the-World) vs Zero-Alloc</text>
    <text x="18" y="178" font-size="11" fill="#34d399">✔ Лаба №1: Token Bucket + Ring</text>
  </g>

  <line x1="589" y1="226" x2="615" y2="226" stroke="#22d3ee" stroke-width="3" marker-end="url(#aCyan)"/>

  <g transform="translate(619, 128)">
    <rect width="265" height="196" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <rect x="14" y="14" width="237" height="32" rx="7" fill="#d97706"/>
    <text x="132" y="35" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">ФАЗА 3: ХРАНЕНИЕ И БД (5 нед)</text>
    <text x="18" y="68" font-size="12.5" font-weight="bold" fill="#fcd34d">PostgreSQL &amp; Redis изнутри</text>
    <text x="18" y="90" font-size="11.8" fill="#cbd5e1">• WAL (Write-Ahead Log) + fsync</text>
    <text x="18" y="110" font-size="11.8" fill="#cbd5e1">• B+Tree (Postgres) vs LSM (Rocks)</text>
    <text x="18" y="130" font-size="11.8" fill="#cbd5e1">• MVCC, Vacuum, EXPLAIN, PgBouncer</text>
    <text x="18" y="150" font-size="11.8" fill="#cbd5e1">• Redis: Cache-Aside &amp; Stampede</text>
    <text x="18" y="178" font-size="11" fill="#34d399">✔ Лаба №2: WAL + MemTable Engine</text>
  </g>

  <line x1="886" y1="226" x2="912" y2="226" stroke="#22d3ee" stroke-width="3" marker-end="url(#aCyan)"/>

  <g transform="translate(916, 128)">
    <rect width="260" height="196" rx="12" fill="#111827" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="14" y="14" width="232" height="32" rx="7" fill="#7c3aed"/>
    <text x="130" y="35" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">ФАЗА 4: API, RPC, KAFKA (4 нед)</text>
    <text x="18" y="68" font-size="12.5" font-weight="bold" fill="#c4b5fd">Коммуникация сервисов</text>
    <text x="18" y="90" font-size="11.8" fill="#cbd5e1">• REST vs gRPC (Protobuf) + Backpressure</text>
    <text x="18" y="110" font-size="11.8" fill="#cbd5e1">• Kafka: Partitions, Offsets, Zero-Copy</text>
    <text x="18" y="130" font-size="11.8" fill="#cbd5e1">• Transactional Outbox + Idempotency</text>
    <text x="18" y="150" font-size="11.8" fill="#cbd5e1">• Circuit Breaker, Timeout, Jitter</text>
    <text x="18" y="178" font-size="11" fill="#34d399">✔ Лаба №3: Circuit Breaker + Retry</text>
  </g>

  <!-- Snake connector from Phase 4 down to Phase 5 -->
  <path d="M 1046 326 L 1046 355 L 157 355 L 157 378" stroke="#fbbf24" stroke-width="3" fill="none" marker-end="url(#aAmber)"/>

  <!-- Bottom Row: Phases 5 to 7 + Interview -->
  <g transform="translate(25, 384)">
    <rect width="265" height="200" rx="12" fill="#111827" stroke="#ec4899" stroke-width="2"/>
    <rect x="14" y="14" width="237" height="32" rx="7" fill="#db2777"/>
    <text x="132" y="35" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">ФАЗА 5: РАСПРЕД. СИСТЕМЫ (6 нед)</text>
    <text x="18" y="68" font-size="12.5" font-weight="bold" fill="#f9a8d4">Сердце Kleppmann DDIA</text>
    <text x="18" y="90" font-size="11.8" fill="#cbd5e1">• CAP &amp; PACELC теоремы</text>
    <text x="18" y="110" font-size="11.8" fill="#cbd5e1">• Репликация (Leader, Quorum R+W&gt;N)</text>
    <text x="18" y="130" font-size="11.8" fill="#cbd5e1">• Sharding &amp; Consistent Hashing</text>
    <text x="18" y="150" font-size="11.8" fill="#cbd5e1">• Консенсус Raft &amp; Saga Pattern</text>
    <text x="18" y="180" font-size="11" fill="#34d399">✔ Практика: Fly.io Gossip Glomers</text>
  </g>

  <line x1="292" y1="484" x2="318" y2="484" stroke="#22d3ee" stroke-width="3" marker-end="url(#aCyan)"/>

  <g transform="translate(322, 384)">
    <rect width="265" height="200" rx="12" fill="#111827" stroke="#ef4444" stroke-width="2"/>
    <rect x="14" y="14" width="237" height="32" rx="7" fill="#dc2626"/>
    <text x="132" y="35" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">ФАЗА 6: HIGH-LOAD &amp; КОНТЕЙНЕРЫ</text>
    <text x="18" y="68" font-size="12.5" font-weight="bold" fill="#fca5a5">Прод-инфраструктура</text>
    <text x="18" y="90" font-size="11.8" fill="#cbd5e1">• L4 (TCP) vs L7 (HTTP) Load Balancer</text>
    <text x="18" y="110" font-size="11.8" fill="#cbd5e1">• Linux Namespaces &amp; cgroups (Docker)</text>
    <text x="18" y="130" font-size="11.8" fill="#cbd5e1">• Kubernetes: Pods, Ingress, HPA</text>
    <text x="18" y="150" font-size="11.8" fill="#cbd5e1">• Graceful Shutdown (SIGTERM)</text>
    <text x="18" y="180" font-size="11" fill="#34d399">✔ Нагрузочный тест: k6 / wrk / hey</text>
  </g>

  <line x1="589" y1="484" x2="615" y2="484" stroke="#22d3ee" stroke-width="3" marker-end="url(#aCyan)"/>

  <g transform="translate(619, 384)">
    <rect width="265" height="200" rx="12" fill="#111827" stroke="#10b981" stroke-width="2"/>
    <rect x="14" y="14" width="237" height="32" rx="7" fill="#059669"/>
    <text x="132" y="35" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">ФАЗА 7: OBSERVABILITY &amp; SRE</text>
    <text x="18" y="68" font-size="12.5" font-weight="bold" fill="#6ee7b7">Как видеть и чинить прод</text>
    <text x="18" y="90" font-size="11.8" fill="#cbd5e1">• Метрики (RED/USE), p95 vs p99</text>
    <text x="18" y="110" font-size="11.8" fill="#cbd5e1">• Логи + OpenTelemetry Tracing</text>
    <text x="18" y="130" font-size="11.8" fill="#cbd5e1">• Профилирование pprof + Flamegraphs</text>
    <text x="18" y="150" font-size="11.8" fill="#cbd5e1">• Диагностика Linux за 60 секунд</text>
    <text x="18" y="180" font-size="11" fill="#34d399">✔ Инструменты: perf, eBPF, ss, iostat</text>
  </g>

  <line x1="886" y1="484" x2="912" y2="484" stroke="#34d399" stroke-width="3" marker-end="url(#aGreen)"/>

  <g transform="translate(916, 384)">
    <rect width="260" height="200" rx="12" fill="#06281e" stroke="#22c55e" stroke-width="2.5"/>
    <rect x="14" y="14" width="232" height="32" rx="7" fill="#16a34a"/>
    <text x="130" y="35" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">ПОРТФОЛИО &amp; SYSTEM DESIGN</text>
    <text x="18" y="68" font-size="12.5" font-weight="bold" fill="#86efac">Доказательство уровня Senior</text>
    <text x="18" y="90" font-size="11.8" fill="#cbd5e1">• 5 системных проектов (WAL/KV,</text>
    <text x="18" y="110" font-size="11.8" fill="#cbd5e1">  Rate Limiter, Scheduler, Outbox)</text>
    <text x="18" y="130" font-size="11.8" fill="#cbd5e1">• System Design за 45 минут</text>
    <text x="18" y="150" font-size="11.8" fill="#cbd5e1">• Расчёт QPS, RAM, Storage, IOPS</text>
    <text x="18" y="180" font-size="11" fill="#fde047">🎯 Backend / Systems / Infra Eng</text>
  </g>

  <!-- Bottom Numbers Every Engineer Should Know -->
  <rect x="25" y="608" width="1150" height="130" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="50" y="640" font-size="15.5" font-weight="bold" fill="#fbbf24">⏱️ ЧИСЛА ЗАДЕРЖЕК (LATENCY NUMBERS EVERY SYSTEMS ENGINEER MUST KNOW):</text>
  <text x="50" y="668" font-size="13" fill="#e2e8f0">• Кэш L1 CPU: <tspan font-weight="bold" fill="#34d399">~1 нс</tspan>  |  • Оперативная память (RAM): <tspan font-weight="bold" fill="#38bdf8">~100 нс</tspan>  |  • Сжатие/Mutex lock: <tspan font-weight="bold" fill="#c084fc">~25 нс</tspan></text>
  <text x="50" y="694" font-size="13" fill="#e2e8f0">• Чтение 4 КБ с NVMe SSD: <tspan font-weight="bold" fill="#fbbf24">~50–150 мкс (в 1000× медленнее RAM!)</tspan>  |  • Внутри 1 дата-центра (Round-Trip): <tspan font-weight="bold" fill="#38bdf8">~0.5 мс</tspan></text>
  <text x="50" y="720" font-size="13" fill="#e2e8f0">• Обычный HDD Seek: <tspan font-weight="bold" fill="#f87171">~10 мс</tspan>  |  • Межконтинентальный пакет (EU ↔ US): <tspan font-weight="bold" fill="#f87171">~80–150 мс (в 1,000,000× медленнее RAM!)</tspan></text>
</svg>
