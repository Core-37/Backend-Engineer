<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0b0f19; font-family:'Segoe UI', Roboto, Arial, sans-serif;">
  <defs>
    <marker id="a5P" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c084fc"/></marker>
    <marker id="a5G" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34d399"/></marker>
  </defs>

  <!-- Header -->
  <rect x="25" y="18" width="1150" height="78" rx="14" fill="#131b2e" stroke="#1e293b" stroke-width="2"/>
  <text x="50" y="52" font-size="22" font-weight="bold" fill="#c084fc">🌐 РАСПРЕДЕЛЁННЫЕ СИСТЕМЫ: CAP/PACELC, CONSISTENT HASHING, КВОРУМ И RAFT</text>
  <text x="50" y="78" font-size="13.5" fill="#94a3b8">Почему в распределённой системе нельзя одновременно иметь всё, как делить данные по шардам и избегать Split-Brain</text>

  <!-- Top Left: CAP & PACELC -->
  <g transform="translate(25, 114)">
    <rect width="565" height="305" rx="12" fill="#111827" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="14" y="14" width="537" height="32" rx="7" fill="#7c3aed"/>
    <text x="282" y="35" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1. ТЕОРЕМА CAP И БОЛЕЕ ТОЧНАЯ PACELC</text>

    <text x="22" y="70" font-size="12.5" fill="#e2e8f0">В сети <tspan font-weight="bold" fill="#f87171">Partition (P)</tspan> (обрыв кабеля между дата-центрами) случается ВСЕГДА!</text>
    <text x="22" y="90" font-size="12.5" fill="#e2e8f0">Поэтому при сбое сети система выбирает только одно из двух:</text>

    <rect x="22" y="108" width="250" height="106" rx="8" fill="#0d1424" stroke="#38bdf8"/>
    <text x="147" y="130" font-size="13" font-weight="bold" fill="#7dd3fc" text-anchor="middle">CP (Consistency + Partition)</text>
    <text x="34" y="152" font-size="11.5" fill="#cbd5e1">Лучше вернуть <tspan font-weight="bold" fill="#f87171">ошибку</tspan>, чем отдать</text>
    <text x="34" y="170" font-size="11.5" fill="#cbd5e1">устаревший баланс или допустить</text>
    <text x="34" y="188" font-size="11.5" fill="#cbd5e1">двух лидеров (<tspan font-weight="bold" fill="#34d399">etcd, ZooKeeper, банки</tspan>).</text>

    <rect x="292" y="108" width="250" height="106" rx="8" fill="#06281e" stroke="#10b981"/>
    <text x="417" y="130" font-size="13" font-weight="bold" fill="#6ee7b7" text-anchor="middle">AP (Availability + Partition)</text>
    <text x="304" y="152" font-size="11.5" fill="#cbd5e1">Отвечаем <tspan font-weight="bold" fill="#34d399">всегда</tspan>, даже если узлы</text>
    <text x="304" y="170" font-size="11.5" fill="#cbd5e1">временно видят разные версии</text>
    <text x="304" y="188" font-size="11.5" fill="#cbd5e1">(<tspan font-weight="bold" fill="#fde047">Cassandra, Dynamo, DNS, лента соцсети</tspan>).</text>

    <rect x="22" y="228" width="520" height="62" rx="8" fill="#090d16" stroke="#475569"/>
    <text x="34" y="250" font-size="12" font-weight="bold" fill="#fbbf24">💡 PACELC идёт дальше: «Если обрыва сети НЕТ (Else), выбирай Latency vs Consistency!»</text>
    <text x="34" y="272" font-size="11.5" fill="#cbd5e1">Синхронная репликация = строго консистентно, но медленно; Асинхронная = быстро, но риск потери данных.</text>
  </g>

  <!-- Top Right: Consistent Hashing Ring -->
  <g transform="translate(610, 114)">
    <rect width="565" height="305" rx="12" fill="#111827" stroke="#06b6d4" stroke-width="2"/>
    <rect x="14" y="14" width="537" height="32" rx="7" fill="#0891b2"/>
    <text x="282" y="35" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2. ШАРДИРОВАНИЕ: CONSISTENT HASHING (БЕЗ ПЕРЕЕЗДА 99% КЛЮЧЕЙ)</text>

    <!-- Visual Hash Ring -->
    <circle cx="155" cy="175" r="85" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
    <circle cx="155" cy="90" r="14" fill="#0284c7" stroke="#fff" stroke-width="2"/>
    <text x="155" y="95" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">S1</text>

    <circle cx="240" cy="175" r="14" fill="#059669" stroke="#fff" stroke-width="2"/>
    <text x="240" y="180" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">S2</text>

    <circle cx="155" cy="260" r="14" fill="#d97706" stroke="#fff" stroke-width="2"/>
    <text x="155" y="265" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">S3</text>

    <circle cx="70" cy="175" r="14" fill="#7c3aed" stroke="#fff" stroke-width="2"/>
    <text x="70" y="180" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">S1'</text>

    <!-- Key point -->
    <circle cx="212" cy="112" r="7" fill="#fde047"/>
    <text x="258" y="114" font-size="11.5" font-weight="bold" fill="#fde047">key(user_42) ➔ по часовой к S2!</text>

    <rect x="275" y="130" width="270" height="158" rx="8" fill="#0d1117" stroke="#334155"/>
    <text x="288" y="152" font-size="12" font-weight="bold" fill="#f87171">❌ Обычный hash(key) % N:</text>
    <text x="288" y="170" font-size="11" fill="#cbd5e1">Добавили 4-й сервер (N=3➔4):</text>
    <text x="288" y="186" font-size="11" fill="#f87171">75%+ кэша и данных слетело!</text>
    <text x="288" y="214" font-size="12" font-weight="bold" fill="#34d399">✅ Consistent Hashing + Vnodes:</text>
    <text x="288" y="232" font-size="11" fill="#cbd5e1">При добавлении узла переедет</text>
    <text x="288" y="248" font-size="11" fill="#34d399">только <tspan font-weight="bold">1/N</tspan> ключей (соседний сектор)!</text>
    <text x="288" y="272" font-size="10.5" fill="#94a3b8">Virtual Nodes (S1') убирают перекос.</text>
  </g>

  <!-- Bottom Left: Quorum R + W > N & Raft -->
  <g transform="translate(25, 438)">
    <rect width="565" height="302" rx="12" fill="#111827" stroke="#10b981" stroke-width="2"/>
    <rect x="14" y="14" width="537" height="32" rx="7" fill="#059669"/>
    <text x="282" y="35" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3. КВОРУМ (R + W &gt; N) И КОНСЕНСУС RAFT</text>

    <rect x="22" y="62" width="520" height="108" rx="8" fill="#091a16" stroke="#34d399"/>
    <text x="34" y="86" font-size="13" font-weight="bold" fill="#6ee7b7">⚖️ Формула кворума: <tspan font-family="monospace" fill="#fde047">R + W &gt; N</tspan> (например, N=3 реплики, W=2, R=2)</text>
    <text x="34" y="110" font-size="11.5" fill="#cbd5e1">• Запись считается успешной, только если ответили минимум <tspan font-weight="bold">W=2</tspan> ноды.</text>
    <text x="34" y="130" font-size="11.5" fill="#cbd5e1">• Читаем с <tspan font-weight="bold">R=2</tspan> нод и берём самую свежую версию: множества W и R</text>
    <text x="34" y="150" font-size="11.5" fill="#34d399">  <tspan font-weight="bold">гарантированно пересекаются минимум в 1 ноде</tspan> со свежими данными!</text>

    <rect x="22" y="184" width="520" height="102" rx="8" fill="#0d1424" stroke="#38bdf8"/>
    <text x="34" y="208" font-size="13" font-weight="bold" fill="#7dd3fc">👑 Как работает Raft (etcd, Consul, CockroachDB):</text>
    <text x="34" y="230" font-size="11.5" fill="#cbd5e1">1. <tspan font-weight="bold" fill="#fde047">Leader Election:</tspan> выбирают 1 Лидера большинством голосов (Term + Heartbeat).</text>
    <text x="34" y="250" font-size="11.5" fill="#cbd5e1">2. <tspan font-weight="bold" fill="#34d399">Log Replication:</tspan> Лидер шлёт запись Фолловерам; коммитит, когда согласились N/2+1.</text>
    <text x="34" y="270" font-size="11.5" fill="#f87171">3. Против <tspan font-weight="bold">Split-Brain</tspan> (2 лидера) всегда ставят НЕЧЁТНОЕ число нод (3 или 5)!</text>
  </g>

  <!-- Bottom Right: Saga vs 2PC & Distributed Failure Modes -->
  <g transform="translate(610, 438)">
    <rect width="565" height="302" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <rect x="14" y="14" width="537" height="32" rx="7" fill="#d97706"/>
    <text x="282" y="35" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">4. ТРАНЗАКЦИИ В МИКРОСЕРВИСАХ: SAGA vs 2PC &amp; ЧАСЫ</text>

    <rect x="20" y="62" width="525" height="114" rx="8" fill="#1a140a" stroke="#fbbf24"/>
    <text x="34" y="86" font-size="13" font-weight="bold" fill="#fde047">🔄 Почему распределённые транзакции (2PC) в микросервисах избегают?</text>
    <text x="34" y="108" font-size="11.5" fill="#cbd5e1">• <tspan font-weight="bold">2PC (Two-Phase Commit):</tspan> держит блокировки во всех базах; если координатор упал —</text>
    <text x="34" y="126" font-size="11.5" fill="#f87171">  все сервисы зависли в блокировке!</text>
    <text x="34" y="148" font-size="11.5" fill="#34d399">• <tspan font-weight="bold">Паттерн Saga:</tspan> цепочка локальных транзакций (Бронь авто ➔ Бронь отеля ➔ Оплата).</text>
    <text x="34" y="166" font-size="11.5" fill="#cbd5e1">  Если шаг 3 упал — выполняем <tspan font-weight="bold" fill="#fde047">компенсирующие действия</tspan> (отмена отеля и авто)!</text>

    <rect x="20" y="188" width="525" height="98" rx="8" fill="#1b1214" stroke="#ef4444"/>
    <text x="34" y="212" font-size="13" font-weight="bold" fill="#fca5a5">⏰ Главная ловушка: Физическим часам (NTP) в разных серверах ВЕРИТЬ НЕЛЬЗЯ!</text>
    <text x="34" y="234" font-size="11.5" fill="#cbd5e1">Часы на сервере А и сервере Б разъезжаются (Clock Skew / Leap Second).</text>
    <text x="34" y="254" font-size="11.5" fill="#cbd5e1">Поэтому для порядка событий используют <tspan font-weight="bold" fill="#38bdf8">Lamport Clocks / Version Vectors / Raft Term</tspan>,</text>
    <text x="34" y="272" font-size="11.5" fill="#cbd5e1">а для таймеров в коде берут <tspan font-family="monospace" fill="#34d399">monotonic clock</tspan> (не прыгает назад при синхронизации NTP!).</text>
  </g>
</svg>
