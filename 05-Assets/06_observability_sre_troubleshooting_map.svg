<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0b0f19; font-family:'Segoe UI', Roboto, Arial, sans-serif;">
  <!-- Header -->
  <rect x="25" y="18" width="1150" height="78" rx="14" fill="#131b2e" stroke="#1e293b" stroke-width="2"/>
  <text x="50" y="52" font-size="22" font-weight="bold" fill="#34d399">🔭 OBSERVABILITY, SRE И ДИАГНОСТИКА ТОРМОЗОВ LINUX ЗА 60 СЕКУНД</text>
  <text x="50" y="78" font-size="13.5" fill="#94a3b8">Три столпа наблюдаемости (Метрики, Логи, Трейсы), почему среднее время ответа врёт (p99) и чек-лист Брендана Грегга</text>

  <!-- Top Row: 3 Pillars of Observability -->
  <g transform="translate(25, 114)">
    <rect width="365" height="270" rx="12" fill="#111827" stroke="#06b6d4" stroke-width="2"/>
    <rect x="14" y="14" width="337" height="32" rx="7" fill="#0891b2"/>
    <text x="182" y="35" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1. МЕТРИКИ (Prometheus + Grafana)</text>
    <text x="18" y="70" font-size="12.5" font-weight="bold" fill="#67e8f9">Метод RED (для сервисов):</text>
    <text x="18" y="90" font-size="11.5" fill="#cbd5e1">• <tspan font-weight="bold">Rate:</tspan> сколько запросов в сек (RPS)</text>
    <text x="18" y="108" font-size="11.5" fill="#cbd5e1">• <tspan font-weight="bold">Errors:</tspan> процент ошибок 5xx</text>
    <text x="18" y="126" font-size="11.5" fill="#cbd5e1">• <tspan font-weight="bold">Duration:</tspan> перцентили <tspan font-weight="bold" fill="#fde047">p50, p95, p99</tspan></text>
    <text x="18" y="156" font-size="12.5" font-weight="bold" fill="#34d399">Метод USE (для железа/БД):</text>
    <text x="18" y="176" font-size="11.5" fill="#cbd5e1">• Utilization (% загрузки CPU/RAM/Диск)</text>
    <text x="18" y="194" font-size="11.5" fill="#cbd5e1">• Saturation (очередь ожидания CPU/IO)</text>
    <text x="18" y="212" font-size="11.5" fill="#cbd5e1">• Errors (ошибки сети/диска)</text>
    <text x="18" y="248" font-size="11.5" fill="#f87171">⚠️ Никогда не верь «среднему» (Avg) —</text>
    <text x="18" y="264" font-size="11.5" fill="#f87171">оно прячет 1% умирающих юзеров (p99)!</text>
  </g>

  <g transform="translate(417, 114)">
    <rect width="365" height="270" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <rect x="14" y="14" width="337" height="32" rx="7" fill="#d97706"/>
    <text x="182" y="35" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2. СТРУКТУРИРОВАННЫЕ ЛОГИ (JSON)</text>
    <text x="18" y="70" font-size="12.5" font-weight="bold" fill="#fcd34d">Стек: Vector / FluentBit ➔ Loki / ELK</text>
    <rect x="16" y="86" width="333" height="106" rx="8" fill="#090d16" stroke="#334155"/>
    <text x="26" y="108" font-family="monospace" font-size="10.8" fill="#cbd5e1">{"level": <tspan fill="#f87171">"error"</tspan>, "svc": "billing",</text>
    <text x="26" y="126" font-family="monospace" font-size="10.8" fill="#cbd5e1"> "trace_id": <tspan fill="#38bdf8">"7f9c2a10..."</tspan>,</text>
    <text x="26" y="144" font-family="monospace" font-size="10.8" fill="#cbd5e1"> "user_id": 4092, "dur_ms": 1840,</text>
    <text x="26" y="162" font-family="monospace" font-size="10.8" fill="#cbd5e1"> "err": "pg: deadlock detected"}</text>
    <text x="26" y="182" font-size="10.5" fill="#94a3b8">Обязателен сквозной trace_id!</text>
    <text x="18" y="220" font-size="11.5" fill="#34d399">✅ Маскируй секреты, пароли и токены!</text>
    <text x="18" y="242" font-size="11.5" fill="#cbd5e1">❌ Писать 100k текстовых строк на диск</text>
    <text x="18" y="258" font-size="11.5" fill="#cbd5e1">   синхронно тормозит приложение.</text>
  </g>

  <g transform="translate(809, 114)">
    <rect width="366" height="270" rx="12" fill="#111827" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="14" y="14" width="338" height="32" rx="7" fill="#7c3aed"/>
    <text x="183" y="35" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3. ТРЕЙСИНГ (OpenTelemetry + Jaeger)</text>
    <text x="18" y="70" font-size="12.5" font-weight="bold" fill="#d8b4fe">Водопад времени по всему микросервису:</text>

    <rect x="18" y="88" width="330" height="28" rx="4" fill="#1e293b"/>
    <rect x="20" y="90" width="315" height="24" rx="3" fill="#3b82f6"/>
    <text x="28" y="107" font-size="11" font-weight="bold" fill="#fff">API Gateway: 420 ms (Весь запрос)</text>

    <rect x="18" y="124" width="330" height="26" rx="4" fill="#1e293b"/>
    <rect x="35" y="126" width="38" height="22" rx="3" fill="#10b981"/>
    <text x="80" y="142" font-size="11" fill="#a7f3d0">Auth gRPC: 12 ms</text>

    <rect x="18" y="158" width="330" height="26" rx="4" fill="#1e293b"/>
    <rect x="75" y="160" width="245" height="22" rx="3" fill="#ef4444"/>
    <text x="84" y="176" font-size="11" font-weight="bold" fill="#fff">SQL SELECT orders: 390 ms (ВИНОВНИК!)</text>

    <text x="18" y="214" font-size="11.5" fill="#cbd5e1">• <tspan font-weight="bold" fill="#38bdf8">Trace:</tspan> весь путь запроса по 10 сервисам.</text>
    <text x="18" y="234" font-size="11.5" fill="#cbd5e1">• <tspan font-weight="bold" fill="#fde047">Span:</tspan> один шаг (HTTP, SQL, Redis).</text>
    <text x="18" y="254" font-size="11.5" fill="#94a3b8">• Нагрузку по CPU ищут через <tspan font-weight="bold" fill="#34d399">Flamegraph</tspan>!</text>
  </g>

  <!-- Bottom: Brendan Gregg 60-second Linux Debug Checklist -->
  <rect x="25" y="404" width="1150" height="336" rx="14" fill="#0d1424" stroke="#10b981" stroke-width="2"/>
  <rect x="40" y="418" width="1120" height="34" rx="8" fill="#059669"/>
  <text x="600" y="440" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">🩺 ЧЕК-ЛИСТ БРЕНДАНА ГРЕГГА: ДИАГНОСТИКА ТОРМОЗЯЩЕГО LINUX-СЕРВЕРА ЗА 60 СЕКУНД (10 КОМАНД)</text>

  <g transform="translate(45, 470)">
    <rect width="540" height="248" rx="10" fill="#111827" stroke="#334155"/>
    <text x="18" y="28" font-family="monospace" font-size="12.5" fill="#fde047">1. uptime</text>
    <text x="185" y="28" font-size="12" fill="#cbd5e1">Load Average (если &gt; числа ядер CPU — очередь!)</text>

    <text x="18" y="54" font-family="monospace" font-size="12.5" fill="#fde047">2. dmesg -T | tail</text>
    <text x="185" y="54" font-size="12" fill="#f87171">Ошибки ядра и OOM Killer (убил процесс за RAM!)</text>

    <text x="18" y="80" font-family="monospace" font-size="12.5" fill="#fde047">3. vmstat 1</text>
    <text x="185" y="80" font-size="12" fill="#cbd5e1">Колонки <tspan font-family="monospace">r</tspan> (очередь CPU), <tspan font-family="monospace">si/so</tspan> (своп!), <tspan font-family="monospace">wa</tspan> (ждём диск)</text>

    <text x="18" y="106" font-family="monospace" font-size="12.5" fill="#fde047">4. mpstat -P ALL 1</text>
    <text x="185" y="106" font-size="12" fill="#cbd5e1">Не загружено ли 1 ядро CPU на 100% (однопоточность!)</text>

    <text x="18" y="132" font-family="monospace" font-size="12.5" fill="#fde047">5. pidstat 1</text>
    <text x="185" y="132" font-size="12" fill="#cbd5e1">Какой именно процесс (PID) жрёт CPU и память прямо сейчас</text>

    <text x="18" y="166" font-size="12.5" font-weight="bold" fill="#34d399">🔥 Если всё висит, а CPU пустой — смотри %iowait:</text>
    <text x="18" y="188" font-size="11.5" fill="#cbd5e1">Сервер спит в ожидании медленного диска или сети (<tspan font-family="monospace">D-state</tspan> процессы)!</text>
    <text x="18" y="212" font-size="11.5" fill="#94a3b8">Для Go-сервисов снимай профиль за 1 команду:</text>
    <text x="18" y="230" font-family="monospace" font-size="11.5" fill="#38bdf8">go tool pprof -http=:8081 http://localhost:6060/debug/pprof/profile</text>
  </g>

  <g transform="translate(615, 470)">
    <rect width="540" height="248" rx="10" fill="#111827" stroke="#334155"/>
    <text x="18" y="28" font-family="monospace" font-size="12.5" fill="#38bdf8">6. iostat -xz 1</text>
    <text x="185" y="28" font-size="12" fill="#cbd5e1">Загрузка диска (<tspan font-family="monospace">%util</tspan> ~100%, <tspan font-family="monospace">await</tspan> в мс — диск задыхается)</text>

    <text x="18" y="54" font-family="monospace" font-size="12.5" fill="#38bdf8">7. free -m</text>
    <text x="185" y="54" font-size="12" fill="#cbd5e1">Свободная RAM и размер <tspan font-family="monospace">buff/cache</tspan> (Linux кэш — это норма!)</text>

    <text x="18" y="80" font-family="monospace" font-size="12.5" fill="#38bdf8">8. sar -n DEV 1</text>
    <text x="185" y="80" font-size="12" fill="#cbd5e1">Скорость и насыщение сетевой карты (Мбит/с и пакеты/с)</text>

    <text x="18" y="106" font-family="monospace" font-size="12.5" fill="#38bdf8">9. ss -s / ss -lnt</text>
    <text x="185" y="106" font-size="12" fill="#cbd5e1">Сокеты TCP, переполнение <tspan font-family="monospace">Recv-Q</tspan> (Accept Queue)</text>

    <text x="18" y="132" font-family="monospace" font-size="12.5" fill="#38bdf8">10. top / htop</text>
    <text x="185" y="132" font-size="12" fill="#cbd5e1">Общий срез процессов, потоков и состояния (R, S, D, Z)</text>

    <text x="18" y="166" font-size="12.5" font-weight="bold" fill="#fbbf24">📊 Метрики надёжности SRE (SLA / SLO / SLI):</text>
    <text x="18" y="188" font-size="11.5" fill="#cbd5e1">• <tspan font-weight="bold">SLI:</tspan> реальный замер (99.95% запросов быстрее 200 мс).</text>
    <text x="18" y="208" font-size="11.5" fill="#cbd5e1">• <tspan font-weight="bold">SLO:</tspan> внутренняя цель команды (99.9% = допуск сбоя 43 мин/мес).</text>
    <text x="18" y="228" font-size="11.5" fill="#cbd5e1">• <tspan font-weight="bold">SLA:</tspan> контракт с клиентом (штраф, если нарушили).</text>
  </g>
</svg>
