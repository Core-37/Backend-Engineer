<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0b0f19; font-family:'Segoe UI', Roboto, Arial, sans-serif;">
  <defs>
    <marker id="arr2C" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="arr2G" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34d399"/></marker>
  </defs>

  <!-- Header -->
  <rect x="25" y="18" width="1150" height="78" rx="14" fill="#131b2e" stroke="#1e293b" stroke-width="2"/>
  <text x="50" y="52" font-size="22" font-weight="bold" fill="#38bdf8">🐧 ПУТЬ СЕТЕВОГО ПАКЕТА В ЯДРЕ LINUX: ОТ СЕТЕВОЙ КАРТЫ ДО EPOLL И WORKER POOL</text>
  <text x="50" y="78" font-size="13.5" fill="#94a3b8">Почему 1 процесс Go/Nginx/Node держит 100,000 соединений (C10K/C100K) и что такое Context Switch и Zero-Copy</text>

  <!-- Hardware & Kernel Space boundary -->
  <rect x="25" y="114" width="1150" height="295" rx="14" fill="#0d1424" stroke="#3b82f6" stroke-width="2"/>
  <text x="45" y="142" font-size="14" font-weight="bold" fill="#60a5fa">🛡️ KERNEL SPACE (Ring 0 — Ядро Linux управляет железом, сокетами и буферами)</text>

  <!-- Step 1: NIC -->
  <g transform="translate(45, 162)">
    <rect width="190" height="225" rx="10" fill="#111827" stroke="#06b6d4"/>
    <text x="95" y="28" font-size="13.5" font-weight="bold" fill="#22d3ee" text-anchor="middle">1. Сетевая карта</text>
    <text x="95" y="48" font-size="12" fill="#94a3b8" text-anchor="middle">(NIC + Ring Buffer)</text>
    <text x="14" y="80" font-size="11.5" fill="#cbd5e1">Пакет прилетает на</text>
    <text x="14" y="98" font-size="11.5" fill="#cbd5e1">кабель/Wi-Fi. Через</text>
    <text x="14" y="116" font-size="11.5" fill="#fde047">DMA (без CPU!)</text>
    <text x="14" y="134" font-size="11.5" fill="#cbd5e1">кладётся в Ring Buffer</text>
    <text x="14" y="152" font-size="11.5" fill="#cbd5e1">в RAM, затем NAPI</text>
    <text x="14" y="170" font-size="11.5" fill="#cbd5e1">будит прерывание</text>
    <text x="14" y="188" font-family="monospace" font-size="11" fill="#34d399">NET_RX_SOFTIRQ</text>
    <text x="14" y="212" font-size="10.5" fill="#94a3b8">Дропы? Смотри: netstat -s</text>
  </g>

  <line x1="237" y1="274" x2="265" y2="274" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr2C)"/>

  <!-- Step 2: TCP/IP Stack -->
  <g transform="translate(269, 162)">
    <rect width="215" height="225" rx="10" fill="#111827" stroke="#3b82f6"/>
    <text x="107" y="28" font-size="13.5" font-weight="bold" fill="#93c5fd" text-anchor="middle">2. Стек TCP/IP Ядра</text>
    <text x="107" y="48" font-size="12" fill="#94a3b8" text-anchor="middle">(sk_buff + Handshake)</text>
    <text x="14" y="80" font-size="11.5" fill="#cbd5e1">• Проверяет IP, CRC</text>
    <text x="14" y="98" font-size="11.5" fill="#cbd5e1">• <tspan font-weight="bold" fill="#fde047">SYN Queue:</tspan> полуоткрытые</text>
    <text x="14" y="116" font-size="11.5" fill="#cbd5e1">  соединения (SYN-ACK)</text>
    <text x="14" y="136" font-size="11.5" fill="#cbd5e1">• <tspan font-weight="bold" fill="#34d399">Accept Queue:</tspan> готовые</text>
    <text x="14" y="154" font-size="11.5" fill="#cbd5e1">  (лимит <tspan font-family="monospace">somaxconn</tspan>!)</text>
    <text x="14" y="178" font-size="11" fill="#f87171">Очередь переполнена?</text>
    <text x="14" y="196" font-size="11" fill="#f87171">➔ Пакеты молча дропаются!</text>
    <text x="14" y="214" font-family="monospace" font-size="10.5" fill="#94a3b8">ss -lnt (Recv-Q/Send-Q)</text>
  </g>

  <line x1="486" y1="274" x2="514" y2="274" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr2C)"/>

  <!-- Step 3: Socket Buffers -->
  <g transform="translate(518, 162)">
    <rect width="215" height="225" rx="10" fill="#111827" stroke="#8b5cf6"/>
    <text x="107" y="28" font-size="13.5" font-weight="bold" fill="#c4b5fd" text-anchor="middle">3. Сокет (FD) и Буферы</text>
    <text x="107" y="48" font-size="12" fill="#94a3b8" text-anchor="middle">(В Linux всё — это файл!)</text>
    <text x="14" y="80" font-size="11.5" fill="#cbd5e1">Каждый клиент = число</text>
    <text x="14" y="98" font-family="monospace" font-size="11.5" fill="#fde047">File Descriptor (fd=42)</text>
    <text x="14" y="122" font-size="11.5" fill="#cbd5e1">• <tspan font-family="monospace" fill="#38bdf8">rmem</tspan> (буфер чтения)</text>
    <text x="14" y="142" font-size="11.5" fill="#cbd5e1">• <tspan font-family="monospace" fill="#38bdf8">wmem</tspan> (буфер записи)</text>
    <text x="14" y="168" font-size="11.5" fill="#f87171">⚠️ Лимит ОС <tspan font-family="monospace">ulimit -n</tspan></text>
    <text x="14" y="186" font-size="11" fill="#cbd5e1">(по умолчанию часто 1024!)</text>
    <text x="14" y="210" font-size="11" fill="#34d399">На проде ставят 100,000+</text>
  </g>

  <line x1="735" y1="274" x2="763" y2="274" stroke="#34d399" stroke-width="3" marker-end="url(#arr2G)"/>

  <!-- Step 4: epoll / io_uring -->
  <g transform="translate(767, 162)">
    <rect width="388" height="225" rx="10" fill="#091a16" stroke="#10b981" stroke-width="2"/>
    <text x="194" y="28" font-size="14" font-weight="bold" fill="#34d399" text-anchor="middle">4. Мультиплексор I/O: epoll / io_uring</text>
    <text x="194" y="48" font-size="12" fill="#a7f3d0" text-anchor="middle">(Как 1 официант обслуживает 100 столиков)</text>
    <text x="16" y="78" font-size="12" fill="#e2e8f0">• Старый <tspan font-family="monospace" fill="#f87171">select/poll</tspan> O(N): каждый раз опрашивает</text>
    <text x="16" y="96" font-size="12" fill="#e2e8f0">  все 50,000 сокетов «есть ли данные?».</text>
    <text x="16" y="120" font-size="12" fill="#e2e8f0">• <tspan font-family="monospace" font-weight="bold" fill="#34d399">epoll</tspan> O(1): ядро САМО складывает только</text>
    <text x="16" y="138" font-size="12" fill="#e2e8f0">  готовые сокеты в список <tspan font-family="monospace" fill="#fde047">rdllist</tspan> через <tspan font-family="monospace">epoll_wait()</tspan>!</text>
    <text x="16" y="164" font-size="12" fill="#e2e8f0">• <tspan font-family="monospace" font-weight="bold" fill="#38bdf8">io_uring</tspan>: общий кольцевой буфер с User Space</text>
    <text x="16" y="182" font-size="12" fill="#e2e8f0">  (минимум дорогих системных вызовов syscall!).</text>
    <text x="16" y="208" font-size="11.5" fill="#fde047">Именно на epoll работают Go netpoller, Nginx, Redis!</text>
  </g>

  <!-- User Space Boundary -->
  <rect x="25" y="426" width="1150" height="314" rx="14" fill="#111827" stroke="#a855f7" stroke-width="2"/>
  <text x="45" y="454" font-size="14" font-weight="bold" fill="#d8b4fe">🚀 USER SPACE (Ring 3 — Твоё приложение: Go / Rust / Python / Java)</text>

  <!-- Syscall transition arrow -->
  <line x1="960" y1="389" x2="960" y2="472" stroke="#34d399" stroke-width="3" marker-end="url(#arr2G)"/>
  <text x="972" y="446" font-size="11.5" font-weight="bold" fill="#fde047">Syscall read() / recv()</text>

  <!-- Left Card: Thread-per-Request vs Event Loop vs Goroutines -->
  <g transform="translate(45, 472)">
    <rect width="675" height="248" rx="10" fill="#0d1117" stroke="#475569"/>
    <text x="20" y="28" font-size="14" font-weight="bold" fill="#fde047">⚡ 3 МОДЕЛИ КОНКУРЕНТНОСТИ В БЭКЕНДЕ:</text>

    <rect x="18" y="44" width="202" height="186" rx="8" fill="#1a0f14" stroke="#ef4444"/>
    <text x="119" y="68" font-size="13" font-weight="bold" fill="#fca5a5" text-anchor="middle">1. Поток на запрос</text>
    <text x="28" y="92" font-size="11.5" fill="#cbd5e1">• 1 клиент = 1 поток ОС</text>
    <text x="28" y="112" font-size="11.5" fill="#cbd5e1">• Стек ~1–8 МБ RAM</text>
    <text x="28" y="132" font-size="11.5" fill="#cbd5e1">• 10,000 клиентов =</text>
    <text x="28" y="150" font-size="11.5" fill="#f87171">  20+ ГБ RAM и ад</text>
    <text x="28" y="168" font-size="11.5" fill="#f87171">  Context Switch CPU!</text>
    <text x="28" y="210" font-size="11" fill="#94a3b8">(Старый Apache / Sync)</text>

    <rect x="236" y="44" width="202" height="186" rx="8" fill="#0f172a" stroke="#38bdf8"/>
    <text x="337" y="68" font-size="13" font-weight="bold" fill="#7dd3fc" text-anchor="middle">2. Event Loop + epoll</text>
    <text x="246" y="92" font-size="11.5" fill="#cbd5e1">• 1 поток на 1 ядро CPU</text>
    <text x="246" y="112" font-size="11.5" fill="#cbd5e1">• Неблокирующий I/O</text>
    <text x="246" y="132" font-size="11.5" fill="#34d399">• 100k соединений OK</text>
    <text x="246" y="154" font-size="11.5" fill="#f87171">• ОПАСНО: блокировка</text>
    <text x="246" y="172" font-size="11.5" fill="#f87171">  CPU-циклом заморозит</text>
    <text x="246" y="190" font-size="11.5" fill="#f87171">  весь сервер!</text>
    <text x="246" y="214" font-size="11" fill="#94a3b8">(Nginx, Node, Python async)</text>

    <rect x="454" y="44" width="203" height="186" rx="8" fill="#06281e" stroke="#10b981"/>
    <text x="555" y="68" font-size="13" font-weight="bold" fill="#6ee7b7" text-anchor="middle">3. M:N (Горутины / Tokio)</text>
    <text x="464" y="92" font-size="11.5" fill="#cbd5e1">• Миллион лёгких задач</text>
    <text x="464" y="112" font-size="11.5" fill="#34d399">• Стек горутины ~2 КБ!</text>
    <text x="464" y="132" font-size="11.5" fill="#cbd5e1">• Планировщик Go сам</text>
    <text x="464" y="150" font-size="11.5" fill="#cbd5e1">  паркует их на epoll</text>
    <text x="464" y="168" font-size="11.5" fill="#cbd5e1">  без блокировки OS Thread!</text>
    <text x="464" y="210" font-size="11" fill="#a7f3d0">(Go GMP, Rust Tokio)</text>
  </g>

  <!-- Right Card: Zero-Copy & Memory -->
  <g transform="translate(740, 472)">
    <rect width="415" height="248" rx="10" fill="#0d1117" stroke="#38bdf8"/>
    <text x="20" y="28" font-size="14" font-weight="bold" fill="#22d3ee">🚀 ZERO-COPY И PAGE CACHE (СЕКРЕТ KAFKA &amp; NGINX)</text>
    <text x="20" y="56" font-size="12" fill="#cbd5e1">Обычная отдача файла с диска в сеть делает</text>
    <text x="20" y="74" font-size="12" fill="#f87171"><tspan font-weight="bold">4 копирования</tspan> и 4 переключения ядро ↔ юзер:</text>
    <text x="20" y="96" font-family="monospace" font-size="11" fill="#94a3b8">Disk ➔ Kernel ➔ User RAM ➔ Kernel Socket ➔ NIC</text>

    <rect x="18" y="112" width="378" height="70" rx="8" fill="#06281e" stroke="#10b981"/>
    <text x="30" y="136" font-size="12.5" font-weight="bold" fill="#34d399">Системный вызов sendfile() — Zero-Copy:</text>
    <text x="30" y="156" font-family="monospace" font-size="11.5" fill="#fde047">Disk ➔ Kernel Page Cache ➔ NIC (DMA)</text>
    <text x="30" y="174" font-size="11" fill="#a7f3d0">Данные вообще НЕ заходят в память программы!</text>

    <text x="20" y="206" font-size="11.5" fill="#cbd5e1">💡 Лишняя память на сервере не простаивает — Linux</text>
    <text x="20" y="224" font-size="11.5" fill="#cbd5e1">держит там <tspan font-weight="bold" fill="#38bdf8">Page Cache</tspan> (горячие файлы и блоки БД).</text>
  </g>
</svg>
